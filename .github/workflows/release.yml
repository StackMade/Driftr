name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Run tests
        run: go test -race ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Place the tag among the release lines
        # A patch to an older major line must take neither "latest" nor the
        # Homebrew formula from a newer stable line. The changelog starts at
        # the previous v* tag: nightly tags never count, and for a stable
        # release neither do release candidates.
        run: |
          tag="$GITHUB_REF_NAME"
          major="${tag#v}"
          major="${major%%.*}"
          newer=$(git tag -l 'v[0-9]*' | grep -v -- '-' | sed 's/^v//' | awk -F. -v m="$major" '$1 > m' | sort -V | tail -1)
          if [ -n "$newer" ]; then
            echo "v$newer is on a newer major line: $tag is not marked latest and leaves the Homebrew tap alone."
            echo "DRIFTR_SUPERSEDED=true" >> "$GITHUB_ENV"
          fi
          args=(--tags --abbrev=0 --match='v[0-9]*')
          case "$tag" in
            *-*) ;;
            *) args+=(--exclude='*-*') ;;
          esac
          if prev=$(git describe "${args[@]}" "$tag^" 2>/dev/null); then
            echo "Changelog from $prev"
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
