name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  nightly:
    # A scheduled run always reads this file from the default branch, so each
    # release line checks out its own branch and publishes under its own tag.
    name: Nightly Build (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: "2.x"
            ref: main
            tag: nightly
          - line: "1.x"
            ref: release/1.x
            tag: nightly-1.x
    env:
      LINE: ${{ matrix.line }}
      REF: ${{ matrix.ref }}
      NIGHTLY_TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Check for new commits since last nightly
        id: newcommits
        run: |
          prev=$(git rev-parse "$NIGHTLY_TAG^{commit}" 2>/dev/null || echo none)
          if [ "$(git rev-parse HEAD)" = "$prev" ]; then
            echo "Nightly tag already points at HEAD; skipping rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # Capture the commit range now — the tag is deleted before release creation.
          {
            echo "changes<<CHANGES_EOF"
            if [ "$prev" != "none" ]; then
              git log --oneline --no-decorate "$prev"..HEAD | head -30
            else
              git log --oneline --no-decorate -10
            fi
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"
          # The nightly tags are not versions: GoReleaser numbers the snapshot
          # after the nearest release tag of this line instead.
          echo "GORELEASER_CURRENT_TAG=$(git describe --tags --abbrev=0 --match='v[0-9]*')" >> "$GITHUB_ENV"

      - name: Run tests
        if: steps.newcommits.outputs.skip != 'true'
        run: go test -race ./...

      - name: Build snapshot
        if: steps.newcommits.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          # skip=sign: nightly is an unstable prerelease and the job has no
          # OIDC token for keyless cosign signing.
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous nightly release
        if: steps.newcommits.outputs.skip != 'true'
        run: gh release delete "$NIGHTLY_TAG" --yes --cleanup-tag 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly release
        if: steps.newcommits.outputs.skip != 'true'
        run: |
          # Release lines before 2.0 build no Windows zips.
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/checksums.txt)
          # The commit list goes through the environment: pasted into the
          # script, a subject with a quote or $(...) in it would run as shell.
          notes="Automated nightly build of the $LINE line from \`$(git rev-parse --short HEAD)\` on $REF.

          **This is an unstable pre-release. Not recommended for production use.**

          Changes since the previous nightly:
          \`\`\`
          $CHANGES
          \`\`\`

          Install: download the archive for your platform, extract, and place \`driftr\` on your PATH."
          gh release create "$NIGHTLY_TAG" "${assets[@]}" \
            --target "$(git rev-parse HEAD)" \
            --title "Nightly $LINE $(date -u +%Y-%m-%d)" \
            --notes "$notes" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGES: ${{ steps.newcommits.outputs.changes }}
      - name: Open issue on failure
        if: failure()
        run: |
          title="Nightly build failed ($LINE)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" \
              --body "The scheduled nightly build of $REF failed: $run_url"
          else
            gh issue comment "$existing" --body "Nightly still failing: $run_url"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/version/
            target: FuzzParse
          - package: ./internal/version/
            target: FuzzParseRange
          - package: ./internal/config/
            target: FuzzParseVersionFile
          - package: ./internal/config/
            target: FuzzLoadPackageJSON
          - package: ./internal/config/
            target: FuzzPatchTopLevelKey
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 2m

      # A crasher lands in <package>/testdata/fuzz/<target>/; keep it so the
      # input can be replayed locally and committed as a regression seed.
      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore
