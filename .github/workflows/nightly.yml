name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  nightly:
    name: Nightly Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Check for new commits since last nightly
        id: newcommits
        run: |
          prev=$(git rev-parse 'nightly^{commit}' 2>/dev/null || echo none)
          if [ "$(git rev-parse HEAD)" = "$prev" ]; then
            echo "Nightly tag already points at HEAD; skipping rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # Capture the commit range now — the tag is deleted before release creation.
          {
            echo "changes<<CHANGES_EOF"
            if [ "$prev" != "none" ]; then
              git log --oneline --no-decorate "$prev"..HEAD | head -30
            else
              git log --oneline --no-decorate -10
            fi
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.newcommits.outputs.skip != 'true'
        run: go test -race ./...

      - name: Build snapshot
        if: steps.newcommits.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          # skip=sign: nightly is an unstable prerelease and the job has no
          # OIDC token for keyless cosign signing.
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous nightly release
        if: steps.newcommits.outputs.skip != 'true'
        run: gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly release
        if: steps.newcommits.outputs.skip != 'true'
        run: |
          gh release create nightly dist/*.tar.gz dist/checksums.txt \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Automated nightly build from \`$(git rev-parse --short HEAD)\` on main.

          **This is an unstable pre-release. Not recommended for production use.**

          Changes since the previous nightly:
          \`\`\`
          ${{ steps.newcommits.outputs.changes }}
          \`\`\`

          Install: download the archive for your platform, extract, and place \`driftr\` on your PATH." \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open issue on failure
        if: failure()
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "Nightly build failed in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "Nightly build failed" \
              --body "The scheduled nightly build failed: $run_url"
          else
            gh issue comment "$existing" --body "Nightly still failing: $run_url"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/version/
            target: FuzzParse
          - package: ./internal/version/
            target: FuzzParseRange
          - package: ./internal/config/
            target: FuzzParseVersionFile
          - package: ./internal/config/
            target: FuzzLoadPackageJSON
          - package: ./internal/config/
            target: FuzzPatchTopLevelKey
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 2m

      # A crasher lands in <package>/testdata/fuzz/<target>/; keep it so the
      # input can be replayed locally and committed as a regression seed.
      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore
