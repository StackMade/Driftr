name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main, "release/**"]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Major bumps and anything that reaches into the shipped binary's direct
      # dependencies are left for a human to read.
      - name: Decide whether a human reads it
        id: gate
        run: echo "needs-human=$NEEDS_HUMAN" >> "$GITHUB_OUTPUT"
        env:
          NEEDS_HUMAN: >-
            ${{ steps.metadata.outputs.update-type == 'version-update:semver-major'
            || contains(steps.metadata.outputs.dependency-names, 'github.com/spf13/cobra')
            || contains(steps.metadata.outputs.dependency-names, 'github.com/BurntSushi/toml')
            || contains(steps.metadata.outputs.dependency-names, 'golang.org/x/sys') }}

      - name: Enable auto-merge
        if: steps.gate.outputs.needs-human != 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain why the update was left open
        if: steps.gate.outputs.needs-human == 'true'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump or a dependency of the shipped binary — auto-merge skipped, needs a human review."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
