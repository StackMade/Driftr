name: CI

on:
  push:
    branches: [main, master, "release/**", feat/windows]
  pull_request:
    branches: [main, master, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.15.0
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Build all release targets
        run: |
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              echo "Building $goos/$goarch"
              GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -o /dev/null ./cmd/driftr/
            done
          done
      - name: Vet for Windows, test files included
        run: GOOS=windows go vet ./...

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: shellcheck install.sh test_path_e2e.sh scripts/*.sh

  install-sh-smoke:
    name: install.sh smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run install.sh end-to-end against latest release
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:bookworm-slim sh -c '
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq ca-certificates curl >/dev/null 2>&1
            sh /src/install.sh || exit 1
            export PATH="$HOME/.driftr/bin:$PATH"
            driftr --version || exit 1
            test -x "$HOME/.driftr/bin/node" || { echo "node shim missing"; exit 1; }
          '

  test-windows:
    # Unit tests and the e2e suite. Scripts whose stand-ins are sh scripts
    # skip themselves; the fixture serves test/fakebin in its Windows archives.
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Run unit and e2e tests
        run: go test -count=1 ./...
      - name: Smoke-test driftr.exe
        shell: pwsh
        run: |
          go build -o driftr.exe ./cmd/driftr/
          ./driftr.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./driftr.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }

  install-ps1-smoke:
    # install.ps1 against a release zip built from this commit, then real
    # Node.js from nodejs.org through the shims: npm, npm -g and a package bin.
    name: install.ps1 smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install from a local release and run node through the shims
        shell: pwsh
        run: |
          $v = '0.0.0'
          $rel = "$env:RUNNER_TEMP\rel\v$v"
          $zip = "$rel\driftr_${v}_windows_amd64.zip"
          New-Item -ItemType Directory -Force $rel | Out-Null
          go build -ldflags "-X github.com/stackmade/driftr/v2/internal/cli.Version=$v" -o "$env:RUNNER_TEMP\pkg\driftr.exe" ./cmd/driftr/
          Compress-Archive "$env:RUNNER_TEMP\pkg\driftr.exe" $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  driftr_${v}_windows_amd64.zip" | Set-Content -Encoding ascii "$rel\checksums.txt"
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', "$env:RUNNER_TEMP\rel" -PassThru
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/ | Out-Null; break } catch { Start-Sleep 1 }
          }

          $env:DRIFTR_VERSION = $v
          $env:DRIFTR_UPDATE_MIRROR = 'http://127.0.0.1:8765'
          ./install.ps1
          # Again, now that driftr.exe exists and must be replaced.
          ./install.ps1
          $server | Stop-Process

          $bin = "$env:USERPROFILE\.driftr\bin"
          $userPath = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if ($userPath -notlike "*$bin*") { throw "user Path lacks $bin`: $userPath" }
          $env:Path = "$bin;$env:Path"

          driftr --version
          driftr install node@22
          if ($LASTEXITCODE -ne 0) { throw 'driftr install failed' }
          driftr default node@22
          $nodeVersion = node -v
          if ($nodeVersion -notlike 'v22.*') { throw "node -v printed $nodeVersion" }
          # A .exe shim passes arguments through untouched; cmd.exe would not.
          $argv = node -e "console.log(process.argv.slice(1).join('|'))" -- 'a b' '"q"' 'c&d' '100%'
          if ($argv -ne 'a b|"q"|c&d|100%') { throw "arguments reached node as: $argv" }
          npm -v
          if ($LASTEXITCODE -ne 0) { throw 'npm failed' }
          # The runner image points npm's global prefix at C:\npm\prefix; a
          # plain machine installs into the Node.js directory, where driftr
          # looks for package bins.
          Remove-Item Env:npm_config_prefix -ErrorAction SilentlyContinue
          npm config get prefix
          npm install -g cowsay@1.6.0
          if ($LASTEXITCODE -ne 0) { throw 'npm install -g failed' }
          if (-not (Test-Path "$bin\cowsay.exe")) { throw 'no shim for the cowsay package bin' }
          $said = cowsay hello | Out-String
          if ($said -notlike '*hello*') { throw "cowsay printed: $said" }
          driftr doctor

  install-ps1-prerelease:
    # While the latest stable release is a 1.x without a Windows build,
    # install.ps1 picks the newest pre-release that has one. Windows
    # PowerShell 5.1 and PowerShell 7 hand JSON arrays down a pipeline
    # differently, so the script runs under both, piped into iex as users run it.
    name: install.ps1 pre-release fallback (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install from a release index whose latest release has no Windows build
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '0.0.1-rc.1'
          $root = "$env:RUNNER_TEMP\rel"
          New-Item -ItemType Directory -Force "$root\v$v" | Out-Null
          go build -ldflags "-X github.com/stackmade/driftr/v2/internal/cli.Version=$v" -o "$env:RUNNER_TEMP\pkg\driftr.exe" ./cmd/driftr/
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          $zip = "$root\v$v\driftr_${v}_windows_amd64.zip"
          Compress-Archive "$env:RUNNER_TEMP\pkg\driftr.exe" $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  driftr_${v}_windows_amd64.zip" | Set-Content -Encoding ascii "$root\v$v\checksums.txt"

          # Newest first, as GitHub lists them: a nightly and a draft come
          # before the pre-release that must win, and the 1.x is latest.
          '{"tag_name":"v0.0.0","assets":[{"name":"driftr_0.0.0_linux_amd64.tar.gz"}]}' | Set-Content -Encoding ascii "$root\latest.json"
          '[{"tag_name":"nightly","draft":false,"assets":[{"name":"driftr_0.0.1-SNAPSHOT-abc_windows_amd64.zip"}]},{"tag_name":"v0.0.2-rc.1","draft":true,"assets":[{"name":"driftr_0.0.2-rc.1_windows_amd64.zip"}]},{"tag_name":"v0.0.1-rc.1","draft":false,"assets":[{"name":"driftr_0.0.1-rc.1_windows_amd64.zip"}]},{"tag_name":"v0.0.0","draft":false,"assets":[{"name":"driftr_0.0.0_linux_amd64.tar.gz"}]}]' | Set-Content -Encoding ascii "$root\releases.json"
          @'
          import http.server, os, sys
          root = sys.argv[1]
          api = {"/api/releases/latest": "latest.json", "/api/releases": "releases.json"}
          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=root, **kwargs)
              def do_GET(self):
                  name = api.get(self.path.split("?")[0])
                  if name is None:
                      return super().do_GET()
                  with open(os.path.join(root, name), "rb") as f:
                      data = f.read()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)
          http.server.ThreadingHTTPServer(("127.0.0.1", 8766), Handler).serve_forever()
          '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\server.py"
          $server = Start-Process python -ArgumentList "$env:RUNNER_TEMP\server.py", $root -PassThru
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8766/api/releases/latest | Out-Null; break } catch { Start-Sleep 1 }
          }

          $env:DRIFTR_UPDATE_API = 'http://127.0.0.1:8766/api'
          $env:DRIFTR_UPDATE_MIRROR = 'http://127.0.0.1:8766'
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          $server | Stop-Process

          $installed = & "$env:USERPROFILE\.driftr\bin\driftr.exe" --version
          if ($installed -notlike "*$v*") { throw "installed $installed, want $v" }
          "installed: $installed"

  test:
    # Covers both the unit tests and the e2e suite in e2e/, which drives a real
    # driftr binary against an in-process fake of nodejs.org, the npm registry
    # and bun's releases. It needs no Docker, so it runs on macOS too — the
    # arm64 runner is also the only place the darwin/arm64 paths get exercised.
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Run unit and e2e tests
        # DRIFTR_E2E_COVERDIR makes the e2e suite build driftr with -cover, so
        # the work it does in a subprocess lands in coverage.txt too. Both
        # profiles are in atomic mode, so appending one to the other merges
        # them.
        #
        # -count=1 is load-bearing. setup-go restores the test cache, and a
        # cached e2e result replays the recorded profile without running
        # TestMain, so the coverdata directory stays empty and the e2e half of
        # the coverage silently disappears.
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-coverdata"
          DRIFTR_E2E_COVERDIR="$RUNNER_TEMP/e2e-coverdata" go test -race -count=1 -coverprofile=unit.cov ./...
          go tool covdata textfmt -i="$RUNNER_TEMP/e2e-coverdata" -o e2e.cov
          cat unit.cov > coverage.txt
          tail -n +2 e2e.cov >> coverage.txt
      # Both runners upload. Codecov merges the two reports, which is the only
      # way the darwin-only branches — platform.OS/Arch, the macOS shell rc
      # paths in pathsetup — are ever counted as covered.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.txt
          flags: ${{ matrix.os }}
          use_oidc: true

  path-e2e-docker:
    name: PATH e2e (${{ matrix.shell }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: zsh
            shell_pkgs: "zsh"
          - shell: bash
            shell_pkgs: "bash"
          - shell: fish
            shell_pkgs: "fish"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.path-e2e
          tags: driftr-path-e2e-${{ matrix.shell }}
          load: true
          build-args: |
            SHELL_PKGS=${{ matrix.shell_pkgs }}
            TEST_SHELL=${{ matrix.shell }}
          cache-from: type=gha,scope=path-e2e-${{ matrix.shell }}
          cache-to: type=gha,scope=path-e2e-${{ matrix.shell }},mode=max
      - name: Run
        run: docker run --rm driftr-path-e2e-${{ matrix.shell }}

  path-e2e-alpine:
    name: PATH e2e (alpine/musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.path-e2e
          tags: driftr-path-e2e-alpine
          load: true
          build-args: |
            BASE_IMAGE=alpine:3.21
            SHELL_PKGS=bash zsh fish
            TEST_SHELL=bash
          cache-from: type=gha,scope=path-e2e-alpine
          cache-to: type=gha,scope=path-e2e-alpine,mode=max
      - name: Run
        # SKIP_SHIM_TESTS: Node.js official binaries are glibc-only and will
        # not exec on musl libc. Phase 1 already proves driftr works on musl.
        run: docker run --rm -e SKIP_SHIM_TESTS=1 driftr-path-e2e-alpine

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # docs/installation.md tells people to build this image to try driftr out,
      # so it has to keep building even though nothing publishes it.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: driftr
          load: true
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,scope=docker-image,mode=max
      - name: Smoke test
        run: |
          docker run --rm driftr --version
          docker run --rm driftr list

  path-e2e-macos:
    name: PATH e2e (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install fish
        run: brew install fish
      - name: Build driftr
        run: go build -o /tmp/driftr ./cmd/driftr/
      - name: Run PATH e2e
        run: |
          export PATH="/tmp:$PATH"
          TEST_SHELL=all sh test_path_e2e.sh
