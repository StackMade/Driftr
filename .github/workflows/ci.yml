name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Build all release targets
        run: |
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              echo "Building $goos/$goarch"
              GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -o /dev/null ./cmd/driftr/
            done
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: shellcheck install.sh test_path_e2e.sh scripts/*.sh

  install-sh-smoke:
    name: install.sh smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run install.sh end-to-end against latest release
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:bookworm-slim sh -c '
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq ca-certificates curl >/dev/null 2>&1
            sh /src/install.sh || exit 1
            export PATH="$HOME/.driftr/bin:$PATH"
            driftr --version || exit 1
            test -x "$HOME/.driftr/bin/node" || { echo "node shim missing"; exit 1; }
          '

  test:
    # Covers both the unit tests and the e2e suite in e2e/, which drives a real
    # driftr binary against an in-process fake of nodejs.org, the npm registry
    # and bun's releases. It needs no Docker, so it runs on macOS too — the
    # arm64 runner is also the only place the darwin/arm64 paths get exercised.
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Run unit and e2e tests
        # DRIFTR_E2E_COVERDIR makes the e2e suite build driftr with -cover, so
        # the work it does in a subprocess lands in coverage.txt too. Both
        # profiles are in atomic mode, so appending one to the other merges
        # them.
        #
        # -count=1 is load-bearing. setup-go restores the test cache, and a
        # cached e2e result replays the recorded profile without running
        # TestMain, so the coverdata directory stays empty and the e2e half of
        # the coverage silently disappears.
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-coverdata"
          DRIFTR_E2E_COVERDIR="$RUNNER_TEMP/e2e-coverdata" go test -race -count=1 -coverprofile=unit.cov ./...
          go tool covdata textfmt -i="$RUNNER_TEMP/e2e-coverdata" -o e2e.cov
          cat unit.cov > coverage.txt
          tail -n +2 e2e.cov >> coverage.txt
      # Both runners upload. Codecov merges the two reports, which is the only
      # way the darwin-only branches — platform.OS/Arch, the macOS shell rc
      # paths in pathsetup — are ever counted as covered.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.txt
          flags: ${{ matrix.os }}
          use_oidc: true

  path-e2e-docker:
    name: PATH e2e (${{ matrix.shell }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: zsh
            shell_pkgs: "zsh"
          - shell: bash
            shell_pkgs: "bash"
          - shell: fish
            shell_pkgs: "fish"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.path-e2e
          tags: driftr-path-e2e-${{ matrix.shell }}
          load: true
          build-args: |
            SHELL_PKGS=${{ matrix.shell_pkgs }}
            TEST_SHELL=${{ matrix.shell }}
          cache-from: type=gha,scope=path-e2e-${{ matrix.shell }}
          cache-to: type=gha,scope=path-e2e-${{ matrix.shell }},mode=max
      - name: Run
        run: docker run --rm driftr-path-e2e-${{ matrix.shell }}

  path-e2e-alpine:
    name: PATH e2e (alpine/musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.path-e2e
          tags: driftr-path-e2e-alpine
          load: true
          build-args: |
            BASE_IMAGE=alpine:3.21
            SHELL_PKGS=bash zsh fish
            TEST_SHELL=bash
          cache-from: type=gha,scope=path-e2e-alpine
          cache-to: type=gha,scope=path-e2e-alpine,mode=max
      - name: Run
        # SKIP_SHIM_TESTS: Node.js official binaries are glibc-only and will
        # not exec on musl libc. Phase 1 already proves driftr works on musl.
        run: docker run --rm -e SKIP_SHIM_TESTS=1 driftr-path-e2e-alpine

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # docs/installation.md tells people to build this image to try driftr out,
      # so it has to keep building even though nothing publishes it.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          tags: driftr
          load: true
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,scope=docker-image,mode=max
      - name: Smoke test
        run: |
          docker run --rm driftr --version
          docker run --rm driftr list

  path-e2e-macos:
    name: PATH e2e (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install fish
        run: brew install fish
      - name: Build driftr
        run: go build -o /tmp/driftr ./cmd/driftr/
      - name: Run PATH e2e
        run: |
          export PATH="/tmp:$PATH"
          TEST_SHELL=all sh test_path_e2e.sh
