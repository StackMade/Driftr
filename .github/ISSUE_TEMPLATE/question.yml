name: Question
description: Ask how to do something with Driftr
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you're trying to do, and what you've tried so far.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Driftr version, OS, shell, and any pin config that matters.
