name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the bug is exploitable (a checksum bypass, extraction outside the version directory,
        code run from a checked-out project), report it through
        [a private advisory](https://github.com/StackMade/Driftr/security/advisories/new)
        instead of a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you saw, including the exact error message.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, starting from a clean shell.
      placeholder: |
        1. Run `driftr install node@22`
        2. Run `node -v`
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      description: Which tool were you running when it broke?
      options:
        - driftr itself
        - node
        - npm / npx
        - pnpm / pnpx
        - yarn
        - bun
        - a globally installed package bin
    validations:
      required: true
  - type: textarea
    id: pin
    attributes:
      label: Version pin
      description: |
        The pin the resolver should have picked up, if any: `.driftr.toml`, the `driftr` key in
        `package.json`, `.nvmrc`, `.node-version`, `engines`, `packageManager`, or the global default.
      render: toml
  - type: input
    id: version
    attributes:
      label: Driftr version
      description: Output of `driftr --version`.
      placeholder: "driftr version 0.9.0 (commit: abc1234, built: 2026-10-01T00:00:00Z)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (ARM64)
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - zsh
        - bash
        - fish
        - other
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - install.sh
        - GitHub release archive
        - go install / built from source
        - other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`driftr doctor` output"
      description: Run it in the directory where the problem happens.
      render: shell
  - type: textarea
    id: verbose
    attributes:
      label: Verbose output
      description: |
        For a resolution problem, `driftr which <tool> -v` shows each config source the resolver
        walked. Otherwise, rerun the failing command with `-v`.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I reproduced this on the latest release.
