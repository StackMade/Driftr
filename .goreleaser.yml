version: 2

builds:
  - main: ./cmd/driftr/
    binary: driftr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/stackmade/driftr/internal/cli.Version={{.Version}}
      - -X github.com/stackmade/driftr/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/stackmade/driftr/internal/cli.Date={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      driftr_{{ .Version }}_{{ .Os }}_{{ .Arch }}

brews:
  - name: driftr
    repository:
      owner: StackMade
      name: homebrew-driftr
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/StackMade/driftr"
    description: "Fast JavaScript toolchain versioning without the friction"
    license: "MIT"
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore: update driftr formula to {{ .Tag }}"
    install: |
      bin.install "driftr"
    caveats: |
      Run setup to create shims and data directories:
        driftr setup

      Add ~/.driftr/bin to the FRONT of your PATH (before Homebrew):
        echo 'export PATH="$HOME/.driftr/bin:$PATH"' >> ~/.zshenv
        echo 'export PATH="$HOME/.driftr/bin:$PATH"' >> ~/.zshrc

      Or run `driftr doctor --fix` to configure PATH automatically.
    # Shims written by driftr 1.2.1 and earlier on Linux exec the versioned
    # Cellar path, which `brew upgrade` would delete. Marking the older kegs
    # with .keepme makes Homebrew's cleanup keep them, so those shims keep
    # working; driftr removes the mark once it has rewritten the shims.
    post_install: |
      if OS.linux?
        prefix.parent.children.each do |keg|
          next if keg == prefix || !(keg/"bin/driftr").exist?

          (keg/".keepme").write("#{keg}/bin/driftr\n")
        end
      end
    test: |
      assert_match version.to_s, shell_output("#{bin}/driftr --version")

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless (Sigstore) signature of the checksums file, in the cosign v3
# bundle format. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'github.com/StackMade/driftr' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  prerelease: auto
